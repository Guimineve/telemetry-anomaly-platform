[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry-simulator"
version = "0.1.0"
description = "Fake device telemetry publisher with triggerable faults"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.11",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.22", "ruff>=0.6"]

[project.scripts]
telemetry-simulator = "simulator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
