# Kubernetes Secrets materialised from the secret manager. Each remote secret is a JSON object
# whose keys become the Secret's keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: telemetry-secrets }
  target: { name: postgres-credentials, creationPolicy: Owner }
  dataFrom:
    # keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    - extract: { key: telemetry/postgres }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: analysis-auth
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: telemetry-secrets }
  target: { name: analysis-auth, creationPolicy: Owner }
  dataFrom:
    # keys: JWT_SECRET (32+ characters), ADMIN_USERNAME, ADMIN_PASSWORD (10+ characters)
    - extract: { key: telemetry/analysis-auth }
