# Development-only values for the local kind cluster. The cloud overlay pulls these from a
# secret manager through External Secrets instead; base contains no secret values.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: telemetry
  POSTGRES_PASSWORD: telemetry-dev-only
  POSTGRES_DB: telemetry
---
# Development placeholder: session signing key and the bootstrap admin.
apiVersion: v1
kind: Secret
metadata:
  name: analysis-auth
type: Opaque
stringData:
  JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: admin-dev-password
---
apiVersion: v1
kind: Secret
metadata:
  name: simulator-auth
type: Opaque
stringData:
  SIMULATOR_TOKEN: simulator-dev-token
