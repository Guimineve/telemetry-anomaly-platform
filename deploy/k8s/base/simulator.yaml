apiVersion: v1
kind: Service
metadata:
  name: simulator
spec:
  selector: { app: simulator }
  ports:
    - { port: 8001, targetPort: 8001 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
spec:
  replicas: 1
  selector:
    matchLabels: { app: simulator }
  template:
    metadata:
      labels: { app: simulator }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: simulator
          image: telemetry-simulator:dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8001
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: DEVICES, value: "5" }
            - { name: TICK_INTERVAL_S, value: "1.0" }
            - name: SIMULATOR_TOKEN
              valueFrom: { secretKeyRef: { name: simulator-auth, key: SIMULATOR_TOKEN } }
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
