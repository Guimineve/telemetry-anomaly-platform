apiVersion: v1
kind: Service
metadata:
  name: ingestion
spec:
  selector: { app: ingestion }
  ports:
    - { port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
spec:
  replicas: 1
  selector:
    matchLabels: { app: ingestion }
  template:
    metadata:
      labels: { app: ingestion }
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          command: ["/bin/sh", "-c", "until nc -z kafka 9092 && nc -z mongo 27017; do echo waiting; sleep 2; done"]
      containers:
        - name: ingestion
          image: telemetry-ingestion:dev
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 8080
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: MONGO_URI, value: "mongodb://mongo:27017/telemetry" }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
