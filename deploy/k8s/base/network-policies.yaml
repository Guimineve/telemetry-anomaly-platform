# Default deny in both directions, then allow only the connections the pipeline uses.
# Probes come from the kubelet and `kubectl port-forward` enters the pod directly, so neither
# needs a rule here. A pod-to-pod connection needs both an egress rule on the client and an
# ingress rule on the server.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# web: reachable from outside (ingress controller / NodePort); talks only to analysis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: analysis } } }]
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analysis
spec:
  podSelector: { matchLabels: { app: analysis } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: web } } }]
      ports: [{ protocol: TCP, port: 8000 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: kafka } } }]
      ports: [{ protocol: TCP, port: 9092 }]
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion
spec:
  podSelector: { matchLabels: { app: ingestion } }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: kafka } } }]
      ports: [{ protocol: TCP, port: 9092 }]
    - to: [{ podSelector: { matchLabels: { app: mongo } } }]
      ports: [{ protocol: TCP, port: 27017 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: simulator
spec:
  podSelector: { matchLabels: { app: simulator } }
  policyTypes: [Ingress, Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: kafka } } }]
      ports: [{ protocol: TCP, port: 9092 }]
---
# Kafka: clients on 9092; the single broker also connects to its own advertised address
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ingestion } }
        - podSelector: { matchLabels: { app: analysis } }
        - podSelector: { matchLabels: { app: simulator } }
        - podSelector: { matchLabels: { app: kafka } }
      ports: [{ protocol: TCP, port: 9092 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: kafka } } }]
      ports: [{ protocol: TCP, port: 9092 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo
spec:
  podSelector: { matchLabels: { app: mongo } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: ingestion } } }]
      ports: [{ protocol: TCP, port: 27017 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: analysis } } }]
      ports: [{ protocol: TCP, port: 5432 }]
