spring:
  application:
    name: telemetry-ingestion
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ingestion
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      ack-mode: manual
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/telemetry}

telemetry:
  topics:
    raw: ${TOPIC_RAW:telemetry.raw}
    validated: ${TOPIC_VALIDATED:telemetry.validated}
    dlq: ${TOPIC_DLQ:telemetry.dlq}
  partitions: ${TOPIC_PARTITIONS:3}
  retention-days: ${RAW_RETENTION_DAYS:7}

management:
  # health and metrics on a separate port that is never exposed outside the pod/host
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
