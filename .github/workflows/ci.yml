name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/pyproject.toml
      - run: pip install -e "simulator[dev]"
      - run: ruff check simulator
      - run: pytest simulator -q

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - run: pip install -e "analysis[dev]"
      - run: ruff check analysis
      - run: cd analysis && mypy src
      # unit tests + Testcontainers integration tests (Postgres, Kafka); the runner has Docker
      - run: pytest analysis -q -rs
      # docs/openapi.json is checked against the generated spec by tests/test_openapi.py;
      # this step also fails the build if regenerating would change the file
      - run: cd analysis && python -m analysis.export_openapi > /tmp/openapi.json && diff /tmp/openapi.json ../docs/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # unit tests + Testcontainers integration tests (the runner has Docker)
      - run: mvn -B -f ingestion/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-test-reports
          path: ingestion/target/*-reports
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx websockets
      - name: Start the whole stack
        run: docker compose up --build --wait --wait-timeout 300 -d
      - name: End-to-end smoke test
        run: python scripts/smoke.py
      - name: Failure modes (stop MongoDB, analysis, PostgreSQL, Kafka; check nothing is lost)
        run: python scripts/failure_modes.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    needs: [simulator, ingestion, analysis, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
          - name: ingestion
            context: .
            file: ingestion/Dockerfile
          - name: analysis
            context: analysis
            file: analysis/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available. Unfixed ones are
      # reported in the table but cannot be acted on, so they do not block.
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan/${{ matrix.name }}:ci
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.cdx.json

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install pip-audit
      - name: Python dependencies with known vulnerabilities (runtime deps of each service)
        run: |
          pip-audit --progress-spinner off analysis
          pip-audit --progress-spinner off simulator
      - name: npm dependencies with known high or critical vulnerabilities
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the tip
      - name: Scan the history for committed secrets (gitleaks)
        env:
          VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$VERSION
          curl -fsSLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep linux_x64 "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact --no-banner --exit-code 1

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests and validate against the Kubernetes schemas
        run: |
          kubectl kustomize deploy/k8s/overlays/kind \
            | docker run -i --rm ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -
          # the cloud overlay uses ExternalSecret, a CRD with no built-in schema
          kubectl kustomize deploy/k8s/overlays/cloud \
            | docker run -i --rm ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -ignore-missing-schemas -
      - name: Base must not contain Secret values
        run: |
          if kubectl kustomize deploy/k8s/base | grep -qE '^kind: Secret$'; then
            echo "deploy/k8s/base renders a Secret; secret values belong in an overlay" >&2; exit 1
          fi

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx websockets
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Build the four images
        run: |
          docker build -t telemetry-simulator:ci simulator
          docker build -t telemetry-analysis:ci analysis
          docker build -t telemetry-web:ci web
          docker build -t telemetry-ingestion:ci -f ingestion/Dockerfile .
      - name: Deploy to a kind cluster and run the end-to-end smoke test
        run: scripts/kind-e2e.sh telemetry- ci
