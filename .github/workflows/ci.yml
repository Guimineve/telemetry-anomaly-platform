name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/pyproject.toml
      - run: pip install -e "simulator[dev]"
      - run: ruff check simulator
      - run: pytest simulator -q

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # unit tests + Testcontainers integration tests (the runner has Docker)
      - run: mvn -B -f ingestion/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-test-reports
          path: ingestion/target/*-reports
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-latest
    needs: [simulator, ingestion]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
          - name: ingestion
            context: .
            file: ingestion/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
