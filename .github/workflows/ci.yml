name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: simulator/pyproject.toml
      - run: pip install -e "simulator[dev]"
      - run: ruff check simulator
      - run: pytest simulator -q

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/pyproject.toml
      - run: pip install -e "analysis[dev]"
      - run: ruff check analysis
      - run: cd analysis && mypy src
      # unit tests + Testcontainers integration tests (Postgres, Kafka); the runner has Docker
      - run: pytest analysis -q -rs
      # docs/openapi.json is checked against the generated spec by tests/test_openapi.py;
      # this step also fails the build if regenerating would change the file
      - run: cd analysis && python -m analysis.export_openapi > /tmp/openapi.json && diff /tmp/openapi.json ../docs/openapi.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # unit tests + Testcontainers integration tests (the runner has Docker)
      - run: mvn -B -f ingestion/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-test-reports
          path: ingestion/target/*-reports
          if-no-files-found: ignore

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx websockets
      - name: Start the whole stack
        run: docker compose up --build --wait --wait-timeout 300 -d
      - name: End-to-end smoke test
        run: python scripts/smoke.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  images:
    runs-on: ubuntu-latest
    needs: [simulator, ingestion, analysis, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
          - name: ingestion
            context: .
            file: ingestion/Dockerfile
          - name: analysis
            context: analysis
            file: analysis/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
