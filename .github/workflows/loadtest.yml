name: Load test

# Manual. Measures ingestion throughput on a GitHub-hosted runner and prints it in the job summary.
# The number is labelled with the runner it came from; it is not comparable to a local run.

on:
  workflow_dispatch:
    inputs:
      readings:
        description: Readings per run
        default: "100000"

jobs:
  loadtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiokafka httpx
      - run: docker compose up --build --wait --wait-timeout 300 -d
      - name: Run
        env:
          LOADTEST_LABEL: GitHub-hosted ubuntu-latest runner
        run: python scripts/loadtest.py -n ${{ inputs.readings }} --runs 3 | tee loadtest.txt
      - name: Summary
        run: sed -n '/^### /,$p' loadtest.txt >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v
