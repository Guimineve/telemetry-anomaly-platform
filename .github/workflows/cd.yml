name: CD

# Publishes images to GitHub Container Registry on every push to main and on version tags.
# There is no persistent hosted environment: the deploy step is an ephemeral kind cluster
# (added with the Kubernetes manifests) that proves the published images run.

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: cosign gets a short-lived certificate for this workflow
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: simulator
            context: simulator
            file: simulator/Dockerfile
          - name: ingestion
            context: .
            file: ingestion/Dockerfile
          - name: analysis
            context: analysis
            file: analysis/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/telemetry-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Signs the pushed digest. Anyone can check it came from this repository's CD workflow
      # with `cosign verify` (see the verify-published job). Vulnerabilities are scanned in CI.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/telemetry-${{ matrix.name }}"
          cosign sign --yes "$image@$DIGEST"

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx websockets
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Check every published image is signed by this repository's CD workflow
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          for svc in simulator ingestion analysis web; do
            cosign verify "ghcr.io/$owner/telemetry-$svc:$tag" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/cd.yml@" \
              > /dev/null && echo "signed: telemetry-$svc"
          done
      - name: Deploy the images that were just published to a kind cluster and smoke test
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          scripts/kind-e2e.sh "ghcr.io/${owner}/telemetry-" "sha-$(echo ${{ github.sha }} | cut -c1-7)"
